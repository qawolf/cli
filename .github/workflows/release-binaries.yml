name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    # Each target builds on its native runner: @napi-rs/keyring installs a
    # host-specific native addon that gets bundled into the compiled binary,
    # so cross-compiled binaries crash at startup with
    # "Failed to load native binding".
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            runner: ubuntu-latest
            outfile: dist/qawolf-linux-x64
          # ubuntu-24.04-arm assumes the repo is public (free arm runners)
          - target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            outfile: dist/qawolf-linux-arm64
          # macos-15-intel is the last Intel macOS image (supported until fall 2027)
          - target: bun-darwin-x64
            runner: macos-15-intel
            outfile: dist/qawolf-darwin-x64
          - target: bun-darwin-arm64
            runner: macos-latest
            outfile: dist/qawolf-darwin-arm64
          - target: bun-windows-x64
            runner: windows-latest
            outfile: dist/qawolf-windows-x64.exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Mirrors the build:binary script in package.json — keep externals/define in sync
      - name: Build binary
        run: >
          bun build --compile --target=${{ matrix.target }} ./src/main.ts
          --outfile ${{ matrix.outfile }}
          --external @qawolf/emails --external @qawolf/testkit
          --define 'process.env.QAWOLF_COMPILED="true"'

      - name: Smoke test binary
        run: ./${{ matrix.outfile }} --version

      - name: Upload to release
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.outfile }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
