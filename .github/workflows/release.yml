name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to upload binaries to (skips changesets)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1.8.0
        with:
          version: bun run version-packages
          publish: npm publish --provenance --access public --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.asset }}
    needs: release
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release.outputs.published == 'true'
      )
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: qawolf-linux-x64
          - os: macos-15
            target: bun-darwin-arm64
            asset: qawolf-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            asset: qawolf-darwin-x64
          - os: windows-latest
            target: bun-windows-x64
            asset: qawolf-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Compile binary
        shell: bash
        run: |
          bun build --compile \
            --target=${{ matrix.target }} \
            --external @qawolf/emails \
            --external @qawolf/testkit \
            ./src/main.ts \
            --outfile dist/${{ matrix.asset }}

      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.asset }} --version

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          PUBLISHED_PACKAGES: ${{ needs.release.outputs.publishedPackages }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            tag=$(echo "$PUBLISHED_PACKAGES" | bun -e '
              const pkgs = JSON.parse(await Bun.stdin.text());
              const cli = pkgs.find((p) => p.name === "@qawolf/cli");
              if (!cli) { process.exit(1); }
              process.stdout.write(`${cli.name}@${cli.version}`);
            ')
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ steps.tag.outputs.tag }}" "dist/${{ matrix.asset }}" --clobber
